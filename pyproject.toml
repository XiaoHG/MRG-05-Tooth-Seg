[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toothseg"
version = "0.1.0"
description = "Minimal tooth detection and segmentation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pillow",
]

[project.optional-dependencies]
train = ["ultralytics>=8.3.0"]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
