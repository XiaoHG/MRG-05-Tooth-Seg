# Faster / lower-memory 224 variant for smoke tests or a first stage.
# Merged on top of dinov3/configs/ssl_default_config.yaml.
# Replace /PATH/TO/... before running.

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  DTYPE: float32

train:
  dataset_path: ImageFolder:root=/PATH/TO/dental_pretrain
  batch_size_per_gpu: 16
  OFFICIAL_EPOCH_LENGTH: 2664   # ceil(42616 / 16)
  num_workers: 8
  checkpointing: true
  checkpointing_full: false
  compile: false
  cudagraphs: false
  saveckp_freq: 5
  seed: 0

student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  n_storage_tokens: 4
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  ffn_layer: mlp
  pos_embed_rope_base: 100.0
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_rescale_coords: 2.0
  pos_embed_rope_dtype: bf16
  resume_from_teacher_chkpt: /PATH/TO/weights/dinov3-vitb16-official.pth

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 5

dino:
  koleo_loss_weight: 0.05
  head_n_prototypes: 65536

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  separate_head: true
  head_n_prototypes: 65536

gram:
  use_loss: true
  ema_teacher: true
  loss_weight: 1.0
  tokens_used: all
  normalized: true
  img_level: false
  remove_neg: false

crops:
  global_crops_size: 224
  local_crops_size: 96
  local_crops_number: 8
  global_crops_scale: [0.32, 1.0]
  local_crops_scale: [0.05, 0.32]

optim:
  epochs: 15
  lr: 0.0003                  # scaled by sqrt_wrt_1024 -> ~1.5e-4 at batch 16
  warmup_epochs: 3
  weight_decay: 0.04
  weight_decay_end: 0.4
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024

checkpointing:
  period: 1000
  max_to_keep: 5

evaluation:
  eval_period_iterations: 999999999
