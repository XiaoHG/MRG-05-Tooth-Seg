# Stage 2: 512/128 high-resolution adaptation, resumed from stage 1.
#
# IMPORTANT: keep train.OFFICIAL_EPOCH_LENGTH = 444.  It is the schedule unit,
# not "images per epoch".  Stage 1 ends at iteration 26640 (60 x 444).  With
# epochs=72 the total is 31968, leaving 5328 steps (~3 passes at batch 24) for
# the high-resolution phase.  The cosine tail starts at ~1.2e-5 and decays to
# 1e-6, which is the intended "low-LR adaptation" regime.
#
# Resume with:
#   CONFIG=.../config_dental_vitb_512.yaml \
#   OUTPUT=.../official-dental-vitb-224 \
#   RESUME=1 bash run_official_dinov3.sh
#
# Memory: batch 24 at 512/128 with 6 local crops is ~22 GB peak, the same token
# count as batch 96 at 224/96.  If OOM, use batch 20 (approx 19 GB) and set
# OFFICIAL_EPOCH_LENGTH to 444 still.

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  DTYPE: float32

train:
  dataset_path: ImageFolder:root=/PATH/TO/dental_pretrain
  batch_size_per_gpu: 24
  OFFICIAL_EPOCH_LENGTH: 444   # schedule unit, do not replace with 42616/24
  num_workers: 12
  checkpointing: true
  checkpointing_full: false
  compile: false
  cudagraphs: false
  saveckp_freq: 50
  seed: 0
  centering: "softmax"

student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  n_storage_tokens: 4
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  ffn_layer: mlp
  pos_embed_rope_base: 100.0
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_rescale_coords: 2.0
  pos_embed_rope_dtype: bf16
  resume_from_teacher_chkpt: /PATH/TO/weights/dinov3-vitb16-official.pth

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 3

dino:
  koleo_loss_weight: 0.05
  head_n_prototypes: 32768

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  separate_head: true
  head_n_prototypes: 32768

gram:
  use_loss: false
  ema_teacher: true
  it_load_ema_teacher: 0
  rep_update: false
  loss_weight: 1.0
  tokens_used: all
  normalized: true
  img_level: false
  remove_neg: false

crops:
  global_crops_size: 512
  local_crops_size: 128
  local_crops_number: 6
  global_crops_scale: [0.32, 1.0]
  local_crops_scale: [0.05, 0.32]

optim:
  epochs: 72                   # 72 x 444 = 31,968: 5,328 steps after stage 1
  # sqrt_wrt_1024: 0.00025 * 4 * sqrt(24/1024) = 1.53e-4 peak.
  # At iteration 26640 the schedule is at ~1.2e-5.
  lr: 0.00025
  warmup_epochs: 3
  weight_decay: 0.04
  weight_decay_end: 0.4
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024

checkpointing:
  period: 500
  max_to_keep: 10
  keep_every: 5000

evaluation:
  eval_period_iterations: 999999999
