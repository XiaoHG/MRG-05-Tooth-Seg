# Stage 2: 512/128 high-resolution adaptation, resumed from stage 1.
#
# IMPORTANT: keep train.OFFICIAL_EPOCH_LENGTH equal to Stage 1 (134).  It is the
# schedule unit, not "images per epoch".  Stage 1 ends at iteration 16080
# (120 x 134).  With epochs=144 the total is 19296, leaving 3216 steps (~1.8
# passes at batch 24) for the high-resolution phase.  The cosine tail starts at
# ~1.3e-5 and decays to 1e-6, which is the intended low-LR adaptation regime.
#
# Resume with:
#   CONFIG=.../config_dental_vitb_512.yaml \
#   OUTPUT=.../official-dental-vitb-224 \
#   RESUME=1 bash run_official_dinov3.sh
#
# Memory at 512/128 batch 24 with 6 local crops has not been probed yet; it is
# expected to be below 12 GB (the old batch-8/512 run used 8.8 GB with 65536
# prototypes).  Batch 32/40 can be tested later, but Stage 2 is short.

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  DTYPE: float32

train:
  dataset_path: ImageFolder:root=/PATH/TO/dental_pretrain
  batch_size_per_gpu: 24
  OFFICIAL_EPOCH_LENGTH: 134   # must equal Stage 1, not ceil(42616/24)
  num_workers: 12
  checkpointing: true
  checkpointing_full: false
  compile: false
  cudagraphs: false
  saveckp_freq: 50
  seed: 0
  centering: "softmax"

student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  n_storage_tokens: 4
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  ffn_layer: mlp
  pos_embed_rope_base: 100.0
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_rescale_coords: 2.0
  pos_embed_rope_dtype: bf16
  resume_from_teacher_chkpt: /PATH/TO/weights/dinov3-vitb16-official.pth

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 3

dino:
  koleo_loss_weight: 0.05
  head_n_prototypes: 32768

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  separate_head: true
  head_n_prototypes: 32768

gram:
  use_loss: false
  ema_teacher: true
  it_load_ema_teacher: 0
  rep_update: false
  loss_weight: 1.0
  tokens_used: all
  normalized: true
  img_level: false
  remove_neg: false

crops:
  global_crops_size: 512
  local_crops_size: 128
  local_crops_number: 6
  global_crops_scale: [0.32, 1.0]
  local_crops_scale: [0.05, 0.32]

optim:
  # 144 x 134 = 19,296 total; Stage 1 ends at 16,080 -> 3,216 steps left.
  epochs: 144
  # sqrt_wrt_1024: 0.00029 * 4 * sqrt(24/1024) = 1.78e-4 peak.
  # At iteration 16080 the schedule is at ~1.3e-5.
  lr: 0.00029
  warmup_epochs: 3
  weight_decay: 0.04
  weight_decay_end: 0.4
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024

checkpointing:
  period: 500
  max_to_keep: 10
  keep_every: 5000

evaluation:
  eval_period_iterations: 999999999
